<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="matrixTitle">
  <title id="matrixTitle">Matrix Theory</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g font-family="'Courier New', Courier, monospace" fill="#f0f0f0">
    <!-- Left bracket -->
    <path d="M 500 250 L 450 250 L 450 650 L 500 650" fill="none" stroke="#fdd835" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right bracket -->
    <path d="M 1100 250 L 1150 250 L 1150 650 L 1100 650" fill="none" stroke="#fdd835" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Matrix entries -->
    <g font-size="58" text-anchor="middle">
      <text x="580" y="345" fill="#fdd835">λ₁</text>
      <text x="800" y="345" fill="#888888">0</text>
      <text x="1020" y="345" fill="#888888">0</text>

      <text x="580" y="470" fill="#888888">0</text>
      <text x="800" y="470" fill="#fdd835">λ₂</text>
      <text x="1020" y="470" fill="#888888">0</text>

      <text x="580" y="595" fill="#888888">0</text>
      <text x="800" y="595" fill="#888888">0</text>
      <text x="1020" y="595" fill="#fdd835">λ₃</text>
    </g>
  </g>

  <text x="800" y="800" font-family="sans-serif" font-size="34" letter-spacing="2" fill="#888888" text-anchor="middle">MATRIX THEORY</text>
</svg>
